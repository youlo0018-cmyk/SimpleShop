# EFK 日志采集（BUSINESS.md 18）
# 应用 -> forward(24224) -> fluentd -> Elasticsearch(9200)

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<filter **>
  @type record_transformer
  enable_ruby

  # 统一时间字段：ES 用 @timestamp 做时间轴，业务字段单独存
  <record>
    service ${record["service"] || "unknown"}
    env     ${record["env"] || "Development"}
  </record>
</filter>

<match simpleshop.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  index_name "#{ENV['FLUENTD_INDEX_PREFIX'] || 'simpleshop'}-logs-%Y.%m.%d"
  logstash_format true
  <buffer>
    @type file
    path /fluentd/log/buffer.log
    flush_interval 5s
    retry_forever true
  </buffer>
</match>

